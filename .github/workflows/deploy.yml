name: Deploy to Cloudflare Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: dayu-study-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check project
        run: pnpm check && pnpm type-check

      - name: Build site
        run: pnpm build

      - name: Debug dump prerender chunks on failure
        if: failure()
        run: |
          cat > /tmp/dumpchunks.cjs <<'EOF'
          const fs = require('fs');
          const root = 'dist/.prerender';
          console.log('typeof window at debug time:', typeof globalThis.window);
          function walk(d) {
            let entries = [];
            try { entries = fs.readdirSync(d, { withFileTypes: true }); } catch (e) { console.log('no dir', d, e.message); return; }
            for (const ent of entries) {
              const fp = d + '/' + ent.name;
              if (ent.isDirectory()) walk(fp);
              else if (ent.name.endsWith('.mjs')) {
                const t = fs.readFileSync(fp, 'utf8');
                const lines = t.split('\n');
                lines.forEach((ln, i) => {
                  if (ln.includes('removeEventListener')) {
                    console.log('=== ' + fp.replace(/'/g, '') + ':' + (i + 1) + ' ===');
                    console.log(lines.slice(Math.max(0, i - 4), i + 5).join('\n'));
                  }
                });
              }
            }
          }
          walk(root);
          EOF
          node /tmp/dumpchunks.cjs

      - name: Upload prerender chunks artifact on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: prerender-chunks
          path: dist/.prerender
          retention-days: 3

      - name: Deploy production
        run: pnpm wrangler pages deploy dist --project-name dayu-study --branch main --commit-dirty=false
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: bf7885385fca9c5531852cc8502b42dc

      - name: Deploy editor worker
        run: pnpm wrangler deploy --config editor-worker/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: bf7885385fca9c5531852cc8502b42dc
